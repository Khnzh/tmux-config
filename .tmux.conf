unbind r
bind r source-file ~/.tmux.conf

set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
# Forward macOS Command chords as Kitty CSI-u sequences to terminal apps.
set -s extended-keys on
set -s extended-keys-format csi-u
set -ag terminal-overrides ",xterm-256color:RGB"
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set-option -g focus-events on

set -g prefix C-a
set -g prefix2 C-ф
unbind C-b
bind-key C-a send-prefix

# Toggle prefix between C-a and C-b
bind-key b if-shell '[ "$(tmux show-option -gv prefix)" = "C-a" ]' \
        'set-option -g prefix C-b ; set-option -g prefix2 C-и ; unbind C-a ; bind-key C-b send-prefix' \
        'set-option -g prefix C-a ; set-option -g prefix2 C-ф ; unbind C-b ; bind-key C-a send-prefix'
bind-key и if-shell '[ "$(tmux show-option -gv prefix)" = "C-a" ]' \
        'set-option -g prefix C-b ; set-option -g prefix2 C-и ; unbind C-a ; bind-key C-b send-prefix' \
        'set-option -g prefix C-a ; set-option -g prefix2 C-ф ; unbind C-b ; bind-key C-a send-prefix'

unbind-key -q W
unbind-key -q -T tree-mode R
unbind-key -q -T tree-mode r
bind-key -T tree-mode 'р' send-keys -
bind-key -T tree-mode 'о' send-keys Down
bind-key -T tree-mode 'л' send-keys Up
bind-key -T tree-mode 'д' send-keys +

bind N command-prompt -p "new session name" 'new-session -s "%%"'
bind a switch-client -T attach-session-path
bind ф switch-client -T attach-session-path
bind -T attach-session-path s command-prompt -I "#{pane_current_path}" -p "session cwd" 'attach-session -c "%%"'
bind -T attach-session-path ы command-prompt -I "#{pane_current_path}" -p "session cwd" 'attach-session -c "%%"'
bind e choose-tree -Zw 'run-shell -b "$HOME/.tmux/prompt-rename-tree-item.sh '\''%1'\''"'
bind w choose-tree -Zw
bind Т command-prompt -p "new session name" 'new-session -s "%%"'
bind у choose-tree -Zw 'run-shell -b "$HOME/.tmux/prompt-rename-tree-item.sh '\''%1'\''"'
bind ц choose-tree -Zw

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf
bind к source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind J if-shell -F '#{pane_marked_set}' { swap-pane -dD -t "{marked}" ; display-message "marked pane moved down" } { display-message "no marked pane" }
bind K if-shell -F '#{pane_marked_set}' { swap-pane -dU -t "{marked}" ; display-message "marked pane moved up" } { display-message "no marked pane" }
bind -r о resize-pane -D 5
bind -r л resize-pane -U 5
bind -r д resize-pane -R 5
bind -r р resize-pane -L 5
bind О if-shell -F '#{pane_marked_set}' { swap-pane -dD -t "{marked}" ; display-message "marked pane moved down" } { display-message "no marked pane" }
bind Л if-shell -F '#{pane_marked_set}' { swap-pane -dU -t "{marked}" ; display-message "marked pane moved up" } { display-message "no marked pane" }

# macOS terminal font size. Prefix + increases, prefix _ decreases.
bind + run-shell 'osascript -e "tell application \"System Events\" to key code 24 using command down"'
bind _ run-shell 'osascript -e "tell application \"System Events\" to key code 27 using command down"'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'м' send -X begin-selection
bind-key -T copy-mode-vi 'М' send -X select-line
bind-key -T copy-mode-vi 'н' send -X copy-selection
bind-key -T copy-mode-vi 'р' send -X cursor-left
bind-key -T copy-mode-vi 'о' send -X cursor-down
bind-key -T copy-mode-vi 'л' send -X cursor-up
bind-key -T copy-mode-vi 'д' send -X cursor-right
bind-key -T copy-mode-vi 'п' send -X history-top
bind-key -T copy-mode-vi 'П' send -X history-bottom
bind-key -T copy-mode-vi 'ц' send -X next-word
bind-key -T copy-mode-vi 'Ц' send -X next-space
bind-key -T copy-mode-vi 'и' send -X previous-word
bind-key -T copy-mode-vi 'И' send -X previous-space

bind m resize-pane -Z
bind ь resize-pane -Z

# Russian keyboard layout aliases for common tmux prefix keys.
bind х copy-mode
bind с new-window
bind в detach-client
bind а command-prompt 'find-window -Z "%%"'
bind ш display-message
bind т next-window
bind щ select-pane -t :.+
bind з previous-window
bind й display-panes
bind ы choose-tree -Zs
bind е clock-mode
bind ч confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind я resize-pane -Z
bind С customize-mode -Z
bind В choose-client -Z
bind У select-layout -E
bind Ш run-shell ~/.tmux/plugins/tpm/bindings/install_plugins
bind Д switch-client -l
bind Г run-shell ~/.tmux/plugins/tpm/bindings/update_plugins
bind М select-pane -M
bind -r M-т next-window -a
bind M-щ rotate-window -D
bind -r M-з previous-window -a
bind M-г run-shell ~/.tmux/plugins/tpm/bindings/clean_plugins

set -g mouse on
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,rxvt*:ignorefkeys'
bind-key -T root MouseDown1Pane if-shell '$HOME/.tmux/open-clicked-link.sh --check #{q:mouse_hyperlink} #{q:mouse_word} #{q:mouse_line}' 'run-shell -b "$HOME/.tmux/open-clicked-link.sh #{q:mouse_hyperlink} #{q:mouse_word} #{q:mouse_line}"' 'select-pane -t= \; send-keys -M'
bind-key -T copy-mode MouseDown1Pane if-shell '$HOME/.tmux/open-clicked-link.sh --check #{q:mouse_hyperlink} #{q:mouse_word} #{q:mouse_line}' 'run-shell -b "$HOME/.tmux/open-clicked-link.sh #{q:mouse_hyperlink} #{q:mouse_word} #{q:mouse_line}"' 'select-pane'
bind-key -T copy-mode-vi MouseDown1Pane if-shell '$HOME/.tmux/open-clicked-link.sh --check #{q:mouse_hyperlink} #{q:mouse_word} #{q:mouse_line}' 'run-shell -b "$HOME/.tmux/open-clicked-link.sh #{q:mouse_hyperlink} #{q:mouse_word} #{q:mouse_line}"' 'select-pane'
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"
set -g @thm_aquamarine '#7fffd4'

# Apply to status bar
# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_green},fg=#{@thm_bg},bold]  #S },#{#[fg=#{@thm_green}]  #S }}"
set -ga status-left "#[fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#{?#{@codex_compact_counter},#[fg=#{@thm_yellow}]C#{@codex_compact_counter} ,}"
set -ga status-left "#[fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"
set -ga status-left "#{?client_prefix,#{#[fg=#{@thm_green},bg=default]},}"

# status right look and feel
set -g @thm_gray '#313244'
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage}#[fg=#{@thm_gray}] "
set -ga status-right "#[bg=#{@thm_gray}]#{?#{==:#{online_status},ok},#[fg=#{@thm_blue}] 󰖩 on ,#[fg=#{@thm_red},bg=#{@thm_gray},bold] 󰖪 off }#[fg=#{@thm_blue}]"
set -ga status-right "#[bg=#{@thm_blue},fg=#{@thm_bg},bold] 󰍛 #{ram_percentage} 󰻠 #{cpu_percentage} "

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Configure Tmux
set -g status-position top
set -g status-justify "absolute-centre"
setw -g pane-border-format " "

# pane border look and feel
setw -g pane-border-status top

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_aquamarine},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"
set -gq allow-passthrough on
set -g visual-activity off
